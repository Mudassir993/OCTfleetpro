<!-- Shared cloud database (Supabase). Safe to leave as-is: app runs in local mode until keys are added below. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   O.C.T. FleetPro V2 — data + persistence layer
   - Structured records: saved in localStorage (survives refresh)
   - Uploaded files: saved in IndexedDB (survives refresh)
   ============================================================ */

const STORAGE_KEY = "octfleetpro.v2";

/* ============================================================
   SHARED CLOUD DATABASE (Supabase) — vehicle records + images
   ------------------------------------------------------------
   To turn on shared mode (everyone sees the same data):
   1. Create a free project at https://supabase.com
   2. Run the SQL from SETUP-BACKEND.md (creates the table + bucket)
   3. Paste your Project URL and publishable/anon key below.
   Until you do, the app runs in LOCAL mode (this browser only).
   ============================================================ */
const SUPABASE_URL = "YOUR_SUPABASE_URL";              // e.g. https://abcd1234.supabase.co
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";  // the publishable / anon key (safe for the browser)
const VEHICLE_BUCKET = "vehicle-images";               // storage bucket name (created in setup)

var sb = null, CLOUD = false;
function initCloud(){
 try{
  if(window.supabase && typeof SUPABASE_URL==="string" && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") && !SUPABASE_KEY.includes("YOUR_")){
   sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
   CLOUD = true;
  }
 }catch(e){ console.warn("Cloud init failed, using local mode:", e); CLOUD=false; }
}

/* ---- cloud data-access layer (vehicle records) ---- */
async function vehiclesLoad(){
 const { data, error } = await sb.from("vehicle_records").select("id,record").order("updated_at",{ascending:false});
 if(error) throw error;
 state.vehicleRecords = (data||[]).map(r=>({ _id:r.id, ...(r.record||{}) }));
}
async function vehicleCreate(rec){
 const clean={...rec}; delete clean._id;
 const { data, error } = await sb.from("vehicle_records").insert({record:clean}).select("id").single();
 if(error) throw error; return data.id;
}
async function vehicleUpdate(id,rec){
 const clean={...rec}; delete clean._id;
 const { error } = await sb.from("vehicle_records").update({record:clean, updated_at:new Date().toISOString()}).eq("id",id);
 if(error) throw error;
}
async function vehicleRemove(id){
 const { error } = await sb.from("vehicle_records").delete().eq("id",id);
 if(error) throw error;
}
/* upload one file to Storage, return {name,url} */
async function cloudUpload(file){
 const path = Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+file.name.replace(/[^\w.\-]/g,"_");
 const { error } = await sb.storage.from(VEHICLE_BUCKET).upload(path, file, {upsert:true, cacheControl:"3600"});
 if(error) throw error;
 const { data } = sb.storage.from(VEHICLE_BUCKET).getPublicUrl(path);
 return { name:file.name, url:data.publicUrl };
}
/* grab files from an <input> — cloud: upload & return {name,url}; local: IndexedDB {id,name} */
async function grabFiles(input){
 if(!input || !input.files || !input.files.length) return [];
 if(CLOUD){ const out=[]; for(const f of Array.from(input.files)) out.push(await cloudUpload(f)); return out; }
 return await captureFiles(input);
}
async function grabImage(input){ const a = await grabFiles(input); return a[0]||null; }
/* refresh vehicle table (+dashboard) from the cloud */
async function refreshVehicles(){
 if(CLOUD){ try{ await vehiclesLoad(); }catch(err){ console.error(err); toast("⚠ Could not load cloud data: "+(err.message||err)); } }
 render_vehicleRecords(); renderDashboard();
}
function deleteVehicle(id){
 if(!confirm("Delete this vehicle record"+(CLOUD?" for everyone":"")+"? This cannot be undone.")) return;
 (async()=>{
  try{
   if(CLOUD){ await vehicleRemove(id); await refreshVehicles(); }
   else { state.vehicleRecords=state.vehicleRecords.filter(r=>r._id!==id); saveState(); renderAll(); }
   toast("Vehicle record deleted"+(CLOUD?" (shared)":"")+" ✓");
  }catch(err){ console.error(err); toast("⚠ Delete failed: "+(err.message||err)); }
 })();
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------------- load / save ---------------- */
var state = loadState();

function loadState(){
 let base = defaultState();
 try{
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
   const saved = JSON.parse(raw);
   // merge: keep default structure, override with saved collections
   for(const k of Object.keys(base)){
    if(Array.isArray(base[k]) && Array.isArray(saved[k])) base[k]=saved[k];
   }
  }
 }catch(e){console.warn("Could not load saved data:",e)}
 // never persist the live session role
 base.role=null; base.user=null;
 base.projectView="active"; base.rentalView="active";
 ensureIds(base);
 return base;
}
function ensureIds(s){
 ["fleet","rentals","breakdowns","maintenance","workshop","locations","garageInventory","staff","vehicleRecords","documents","users"].forEach(coll=>{
  (s[coll]||[]).forEach(r=>{ if(!r._id) r._id=uid(); });
 });
}
function saveState(){
 try{
  const copy={};
  ["fleet","rentals","breakdowns","maintenance","workshop","locations","garageInventory","staff","vehicleRecords","documents","users"].forEach(k=>copy[k]=state[k]);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
 }catch(e){
  toast("⚠ Could not save (storage full). Export a backup.");
  console.error(e);
 }
}

/* ---------------- IndexedDB file store ---------------- */
let _db=null;
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);let r;try{r=indexedDB.open("octfleetpro_files",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files")};r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function idbPut(id,blob){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}catch(e){console.warn("file store failed",e);return false}}
async function idbGet(id){try{const db=await openDB();return await new Promise(res=>{const tx=db.transaction("files","readonly");const rq=tx.objectStore("files").get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch(e){return null}}
async function captureFiles(inputEl){const out=[];if(!inputEl||!inputEl.files||!inputEl.files.length)return out;for(const f of Array.from(inputEl.files)){const id=uid();const ok=await idbPut(id,f);out.push({id:ok?id:null,name:f.name,type:f.type,size:f.size})}return out}
async function openFile(id){const blob=await idbGet(id);if(!blob){toast("File not available (stored on a different browser/device)");return}const url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)}
function fileLinks(arr){if(!arr||!arr.length)return "—";return arr.map(f=>{if(f&&f.url)return `<a class="filelink" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`;if(f&&f.id)return `<span class="filelink" onclick="openFile('${f.id}')">${esc(f.name)}</span>`;return esc(f&&f.name||f)}).join(", ")}

function login(){
 const p=document.getElementById("portal").value,u=document.getElementById("username").value.trim(),pw=document.getElementById("password").value;
 if((p==="admin"&&u==="admin"&&pw==="admin123")||(p==="user"&&u==="staff"&&pw==="staff123")){
  state.role=p;state.user=u;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  buildNav();buildPages();
  showPage(p==="admin"?"dashboard":"userdash");
  document.getElementById("datePill").textContent=new Date().toLocaleDateString();
  document.getElementById("userPill").textContent=(p==="admin"?"Administrator":"Staff User");
  if(CLOUD) refreshVehicles();
 }else alert("Invalid demo credentials.");
}
function logout(){state.role=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function buildNav(){document.getElementById("roleLabel").textContent=state.role==="admin"?"Administrator":"Staff / User";document.getElementById("nav").innerHTML=(state.role==="admin"?adminNav:userNav).map(x=>`<button data-page="${x[0]}" onclick="showPage('${x[0]}')">${x[1]}</button>`).join("")}
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));let el=document.getElementById(id);if(el)el.classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));document.getElementById("pageTitle").textContent=titles[id]||"FleetPro";if(id==="vehicleRecords"&&CLOUD)refreshVehicles()}

/* ---------------- helpers ---------------- */
function badge(s){s=s||"";let l=s.toLowerCase();let c=l.includes("break")||l.includes("overdue")||l.includes("expired")||s==="Open"?"breakdown":l.includes("rent")||s==="Active"||l.includes("progress")?"rented":l.includes("maint")||l.includes("due")||l.includes("expir")||l.includes("scheduled")||l.includes("low")?"maintenance":"available";return `<span class="badge ${c}">${esc(s)}</span>`}
/* project status badge: Started(orange) / On Going(blue) / Closed(green) */
function projBadge(s){s=s||"—";let l=s.toLowerCase();let c=l.includes("going")?"rented":l.includes("clos")?"available":l.includes("start")?"maintenance":"available";return `<span class="badge ${c}">${esc(s)}</span>`}
/* payment status badge: Active(blue) / Partial(orange) / Payment received(green) */
function payBadge(s){s=s||"—";let l=s.toLowerCase();let c=l.includes("partial")?"maintenance":l.includes("received")&&!l.includes("partial")?"available":"rented";return `<span class="badge ${c}">${esc(s)}</span>`}
/* money helpers */
function amt(v){if(v==null)return 0;let n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n}
function money(n){return "QAR "+Math.round(n).toLocaleString()}
/* selection + archive (Projects & Rentals) */
function toggleAll(bodyId,src){document.querySelectorAll("#"+bodyId+" .rowchk").forEach(c=>{c.checked=src.checked})}
function setView(coll,mode){if(coll==="fleet")state.projectView=mode;else state.rentalView=mode;renderAll()}
function moveSelected(coll,bodyId,toArchived){const ids=Array.from(document.querySelectorAll("#"+bodyId+" .rowchk:checked")).map(c=>c.dataset.id);if(!ids.length){toast("Tick at least one row first");return}ids.forEach(id=>{let r=find(coll,id);if(r)r.archived=toArchived});saveState();renderAll();toast(ids.length+" moved to "+(toArchived?"Archive":"Active"))}
function viewToggle(coll,current){return `<div style="display:inline-flex;gap:4px"><button class="btn ${current==="active"?"primary":"secondary"} mini" onclick="setView('${coll}','active')">Active</button><button class="btn ${current==="archived"?"primary":"secondary"} mini" onclick="setView('${coll}','archived')">Archived</button></div>`}
function moveBtn(coll,bodyId,current){return current==="active"?`<button class="btn secondary" onclick="moveSelected('${coll}','${bodyId}',true)">Move to Archive ▸</button>`:`<button class="btn secondary" onclick="moveSelected('${coll}','${bodyId}',false)">◂ Move to Active</button>`}
function opts(list,sel){return list.map(v=>`<option ${v===sel?"selected":""}>${esc(v)}</option>`).join("")}
function fleetOpts(sel){return state.fleet.map(f=>`<option ${f.id===sel?"selected":""}>${esc(f.id)}</option>`).join("")}
function find(coll,id){return state[coll].find(r=>r._id===id)}
function del(coll,id){if(!confirm("Delete this record permanently?"))return;state[coll]=state[coll].filter(r=>r._id!==id);saveState();renderAll();toast("Record deleted")}
function actionBtns(coll,id,editFn){return `<div class="rowbtns"><button class="btn secondary mini" onclick="${editFn}('${id}')">Edit</button><button class="btn danger mini" onclick="del('${coll}','${id}')">Delete</button></div>`}
function daysLeft(dateStr){if(!dateStr)return null;let t=Date.parse(dateStr);if(isNaN(t))return null;return Math.ceil((t-Date.now())/86400000)}
function docStatus(dateStr){let d=daysLeft(dateStr);if(d==null)return "Valid";if(d<0)return "Expired";if(d<=30)return "Expiring Soon";return "Valid"}

function toolbar(pageId,searchPh,addLabel,addFn){
 return `<div class="toolbar">
  <input id="${pageId}Search" placeholder="${searchPh}" oninput="render_${pageId}()">
  ${addLabel?`<button class="btn primary" onclick="${addFn}">${addLabel}</button>`:""}
  <button class="btn secondary" onclick="exportCSV('${pageId}')">Export CSV</button>
 </div>`;
}
function tableShell(pageId,heads){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Actions</th></tr></thead><tbody id="${pageId}Rows"></tbody></table></div>`}
function filterRows(coll,pageId){let q=(document.getElementById(pageId+"Search")?.value||"").toLowerCase();return state[coll].filter(r=>Object.entries(r).filter(([k])=>k!=="_id"&&k!=="docFiles").map(([,v])=>v).join(" ").toLowerCase().includes(q))}
function emptyRow(n){return `<tr><td colspan="${n}" class="empty">No records yet. Use the “Add” button above.</td></tr>`}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
 const list=state.fleet.filter(f=>!f.archived);
 const total=list.length,
   started=list.filter(x=>x.projectStatus==="Started").length,
   going=list.filter(x=>x.projectStatus==="On Going").length,
   closed=list.filter(x=>x.projectStatus==="Closed").length,
   archived=state.fleet.filter(f=>f.archived).length;
 const maxStatus=Math.max(started,going,closed,1), totalStatus=started+going+closed||1;
 const stPct=Math.round(started/totalStatus*100),goPct=Math.round(going/totalStatus*100);
 const donutStyle=`background:conic-gradient(var(--orange) 0 ${stPct}%,var(--accent) ${stPct}% ${stPct+goPct}%,var(--green) ${stPct+goPct}% 100%)`;
 document.getElementById("dashboard").innerHTML=`<div class="cards">
 <div class="card"><div class="label">TOTAL PROJECTS</div><div class="num">${total}</div></div>
 <div class="card"><div class="label">STARTED</div><div class="num orange">${started}</div></div>
 <div class="card"><div class="label">ON GOING</div><div class="num blue">${going}</div></div>
 <div class="card"><div class="label">CLOSED</div><div class="num green">${closed}</div></div>
 <div class="card"><div class="label">ARCHIVED</div><div class="num">${archived}</div></div></div>
 <div class="dash-charts">
  <div class="chart-card"><h2>Project Status Distribution</h2><div class="chart-sub">Active projects by current status</div><div class="donut-wrap"><div class="donut" style="${donutStyle}"></div><div class="legend"><div class="legend-item"><span class="legend-dot dot-orange"></span>Started: ${started}</div><div class="legend-item"><span class="legend-dot dot-blue"></span>On Going: ${going}</div><div class="legend-item"><span class="legend-dot dot-green"></span>Closed: ${closed}</div></div></div></div>
  <div class="chart-card"><h2>Projects by Status</h2><div class="chart-sub">Count of active projects per status</div><div class="bar-chart">
   <div class="bar-row"><span>Started</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,started/maxStatus*100)}%"></div></div><b>${started}</b></div>
   <div class="bar-row"><span>On Going</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,going/maxStatus*100)}%"></div></div><b>${going}</b></div>
   <div class="bar-row"><span>Closed</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,closed/maxStatus*100)}%"></div></div><b>${closed}</b></div>
  </div><div class="chart-note">Charts update automatically when projects change.</div></div>
 </div>
 <div class="grid">
  <div>
   <div class="panel"><h2>Projects Overview</h2>${fleetTable()}</div>
  </div>
  <div><div class="panel"><h2>Alerts</h2>${buildAlerts()}</div></div>
 </div>`;
}
function buildAlerts(){
 let a=[];
 state.breakdowns.filter(b=>b.status!=="Closed").forEach(b=>a.push(["red",`${b.fleet} — ${b.reason}`]));
 state.maintenance.filter(m=>/overdue/i.test(m.status)).forEach(m=>a.push(["orange",`${m.fleet} — ${m.service} overdue`]));
 state.maintenance.filter(m=>/due/i.test(m.status)).forEach(m=>a.push(["orange",`${m.fleet} — ${m.service} due soon`]));
 state.documents.forEach(d=>{let dl=daysLeft(d.expiry);if(dl!=null&&dl<=30)a.push(["orange",`${d.fleet} — ${d.doc} ${dl<0?"expired":"expires in "+dl+" days"}`])});
 state.vehicleRecords.forEach(v=>{let dl=daysLeft(v.insuranceExpiry);if(dl!=null&&dl<=30)a.push(["orange",`${v.fleet} — insurance ${dl<0?"expired":"expires in "+dl+" days"}`])});
 state.garageInventory.filter(i=>Number(i.qty)<Number(i.min)).forEach(i=>a.push(["orange",`${i.item} — low stock (${i.qty}/${i.min})`]));
 if(!a.length)return `<div class="alert success">🟢 No critical alerts. All systems normal.</div>`;
 return a.slice(0,12).map(([c,t])=>`<div class="alert ${c==="red"?"":"success"}" style="${c==="orange"?"border-left-color:var(--orange);background:#fff8f1":""}">${c==="red"?"🔴":"🟠"} ${esc(t)}</div>`).join("");
}

 const btn=e.submitter||e.target.querySelector('button[type="submit"],button:not([type])');
 const oldTxt=btn?btn.textContent:"";
 if(btn){btn.disabled=true;btn.textContent=CLOUD?"Saving to cloud…":"Saving…";}
 try{
  let nf=[...await grabFiles(v_insfile),...await grabFiles(v_regfile),...await grabFiles(v_inspfile),...await grabFiles(v_otherfile)];
  let img=await grabImage(v_imgfile);
  let existing=id?find("vehicleRecords",id):{};
  let rec={fleet:v_fleet.value,registration:v_reg.value.trim(),vin:v_vin.value.trim(),insurancePolicy:v_ins.value.trim(),insuranceExpiry:v_insexp.value,registrationExpiry:v_regexp.value,inspectionExpiry:v_inspexp.value,purchaseDate:v_pur.value,lastOilChange:v_oil.value.trim(),comment:document.getElementById("v_comment").value,imageFile:img||existing.imageFile||null,docFiles:[...(existing.docFiles||[]),...nf]};
  if(CLOUD){
   if(id) await vehicleUpdate(id,rec); else await vehicleCreate(rec);
   closeModal(); await refreshVehicles(); showPage("vehicleRecords");
   toast("Vehicle record "+(id?"updated":"added")+" (shared) ✓");
  }else{
   upsert("vehicleRecords",id,rec);
   done("vehicleRecords","Vehicle record "+(id?"updated":"added"));
  }
 }catch(err){
  console.error(err);
  if(btn){btn.disabled=false;btn.textContent=oldTxt;}
  toast("⚠ Save failed: "+(err.message||err));
 }
}

/* DOCUMENTS (with file upload) */
function openDocument(id){let d=id?find("documents",id):{};openModal(id?"Edit Document":"Upload Document",`<form onsubmit="saveDocument(event,'${id||""}')"><div class="formgrid">
 <div class="field"><label>Fleet / Asset</label><input id="d_fleet" value="${esc(d.fleet||"")}" required></div>
 <div class="field"><label>Document Type</label><input id="d_doc" value="${esc(d.doc||"")}" placeholder="Insurance / Registration" required></div>
 <div class="field"><label>Expiry Date</label><input id="d_exp" type="date" value="${esc(d.expiry||"")}"></div>
 <div class="field"><label>File Upload</label><input id="d_file" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
 </div><div class="hint">${id&&d.docFiles&&d.docFiles.length?"Existing: "+fileLinks(d.docFiles):"Status (Valid / Expiring / Expired) is calculated from the expiry date."}</div>${submitBtn(id?"Update":"Save Document")}</form>`)}
async function saveDocument(e,id){e.preventDefault();let nf=await captureFiles(d_file);let existing=id?(find("documents",id).docFiles||[]):[];let rec={fleet:d_fleet.value.trim(),doc:d_doc.value.trim(),expiry:d_exp.value,status:docStatus(d_exp.value),docFiles:[...existing,...nf]};upsert("documents",id,rec);done("documents","Document "+(id?"updated":"saved"))}

/* USERS */
function openUser(id){let u=id?find("users",id):{};openModal(id?"Edit User":"Add User",`<form onsubmit="saveUser(event,'${id||""}')"><div class="formgrid">
 <div class="field"><label>Username</label><input id="u_username" value="${esc(u.username||"")}" required></div>
 <div class="field"><label>Full Name</label><input id="u_name" value="${esc(u.name||"")}" required></div>
 <div class="field"><label>Role</label><select id="u_role">${opts(["Administrator","Workshop Manager","Staff / Operator"],u.role||"Staff / Operator")}</select></div>
 <div class="field"><label>Email</label><input id="u_email" type="email" value="${esc(u.email||"")}"></div>
 <div class="field"><label>Phone</label><input id="u_phone" value="${esc(u.phone||"")}"></div>
 <div class="field"><label>Status</label><select id="u_status">${opts(["Active","Inactive"],u.status||"Active")}</select></div>
 </div>${submitBtn(id?"Update User":"Save User")}</form>`)}
function saveUser(e,id){e.preventDefault();let rec={username:u_username.value.trim(),name:u_name.value.trim(),role:u_role.value,email:u_email.value.trim(),phone:u_phone.value.trim(),status:u_status.value};upsert("users",id,rec);done("users","User "+(id?"updated":"added"))}

/* ---------------- upsert / done ---------------- */
function upsert(coll,id,rec){
 if(id){let existing=find(coll,id);Object.assign(existing,rec);}
 else{rec._id=uid();state[coll].push(rec);}
 saveState();
}
function done(page,msg){closeModal();renderAll();showPage(page);toast(msg+" ✓")}

/* ============================================================
   USER PORTAL forms
   ============================================================ */
function userDash(){
 const assigned=state.rentals.filter(r=>r.status==="Active").length;
 const open=state.breakdowns.filter(b=>b.status!=="Closed").length;
 const due=state.maintenance.filter(m=>/due|overdue/i.test(m.status)).length;
 return `<div class="cards">
  <div class="card"><div class="label">ACTIVE RENTALS</div><div class="num blue">${assigned}</div></div>
  <div class="card"><div class="label">OPEN BREAKDOWNS</div><div class="num red">${open}</div></div>
  <div class="card"><div class="label">SERVICE DUE</div><div class="num orange">${due}</div></div></div>
  <div class="grid"><div class="panel"><h2>Quick Actions</h2>
   <button class="btn primary" onclick="showPage('report')">Report Breakdown</button>
   <button class="btn secondary" onclick="showPage('myfleet')">View My Equipment</button></div>
  <div class="panel"><h2>Notice</h2>${buildAlerts()}</div></div>`;
}
function reportBreakdownForm(){
 return `<div class="panel"><h2>Report a Breakdown</h2><form onsubmit="submitUserBreakdown(event)"><div class="formgrid">
  <div class="field"><label>Equipment</label><select id="ub_fleet">${fleetOpts()}</select></div>
  <div class="field"><label>Location</label><input id="ub_location" required placeholder="Project / site"></div>
  <div class="field"><label>Severity</label><select id="ub_sev">${opts(["Low","Medium","High","Critical"],"Medium")}</select></div>
  <div class="field"><label>Reason</label><select id="ub_reason">${opts(["Engine","Hydraulic","Electrical","Transmission","Cooling","Tyres / Undercarriage","Operator Related","Other"],"Engine")}</select></div>
  <div class="field"><label>Engine Hours</label><input id="ub_hours" type="number" min="0" required></div>
  <div class="field"><label>Description</label><input id="ub_desc" required placeholder="Describe the problem"></div>
  </div><button class="btn primary" style="margin-top:16px">Submit Breakdown</button></form></div>`;
}
function submitUserBreakdown(e){e.preventDefault();
 let rec={_id:uid(),no:"BD-"+new Date().getFullYear()+"-"+Date.now().toString().slice(-5),fleet:ub_fleet.value,date:new Date().toISOString().slice(0,10),location:ub_location.value.trim(),severity:ub_sev.value,reason:ub_reason.value+" — "+ub_desc.value.trim(),hours:ub_hours.value,status:"Open"};
 state.breakdowns.unshift(rec);let f=state.fleet.find(x=>x.id===rec.fleet);if(f)f.status="Breakdown";saveState();renderAll();showPage("userdash");toast("Breakdown submitted to maintenance team ✓")}

/* ============================================================
   REPORTS + BACKUP / EXPORT
   ============================================================ */
function renderReports(){
 const list=state.fleet.filter(f=>!f.archived);
 const total=list.length,
   going=list.filter(x=>x.projectStatus==="On Going").length,
   closed=list.filter(x=>x.projectStatus==="Closed").length,
   openBd=state.breakdowns.filter(b=>b.status!=="Closed").length,
   low=state.garageInventory.filter(i=>Number(i.qty)<Number(i.min)).length,
   activeRent=state.rentals.filter(r=>!r.archived).length,
   outstanding=state.rentals.filter(r=>!r.archived).reduce((s,r)=>{let t=amt(r.totalAmount!=null?r.totalAmount:r.rate);let p=r.status==="Payment received"?t:(r.status==="Partial payment received"?amt(r.partialPayment):0);return s+(t-p)},0);
 document.getElementById("reports").innerHTML=`
 <div class="cards">
  <div class="card"><div class="label">TOTAL PROJECTS</div><div class="num">${total}</div></div>
  <div class="card"><div class="label">ON GOING</div><div class="num blue">${going}</div></div>
  <div class="card"><div class="label">CLOSED</div><div class="num green">${closed}</div></div>
  <div class="card"><div class="label">ACTIVE RENTALS</div><div class="num orange">${activeRent}</div></div>
  <div class="card"><div class="label">OUTSTANDING</div><div class="num red">${money(outstanding)}</div></div></div>
 <div class="panel" style="margin-top:16px"><h2>Management Reports</h2>
  <p class="muted">Live figures calculated from your records. Open breakdowns: ${openBd}. Low-stock parts: ${low}. Export any table to CSV, or back up the entire database as JSON.</p>
  <div class="toolbar" style="margin-top:10px">
   <button class="btn secondary" onclick="exportCSV('fleet')">Projects CSV</button>
   <button class="btn secondary" onclick="exportCSV('rentals')">Rentals CSV</button>
   <button class="btn secondary" onclick="exportCSV('maintenance')">Maintenance CSV</button>
   <button class="btn secondary" onclick="exportCSV('breakdowns')">Breakdowns CSV</button>
   <button class="btn secondary" onclick="exportCSV('inventory')">Inventory CSV</button>
   <button class="btn secondary" onclick="exportCSV('staff')">Staff CSV</button>
  </div>
 </div>
 <div class="panel"><h2>Backup & Restore</h2>
  <p class="muted">Data is saved in this browser automatically. Use backup to move data to another device or keep a copy.</p>
  <div class="toolbar" style="margin-top:10px">
   <button class="btn primary" onclick="exportJSON()">⬇ Export Backup (JSON)</button>
   <button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
   <input id="importFile" type="file" accept=".json" class="hidden" onchange="importJSON(event)">
   <button class="btn secondary" onclick="resetDemo()">Reset to Demo Data</button>
   <button class="btn danger" onclick="clearAll()">Clear All Data</button>
  </div>
 </div>`;
}

function toCSV(rows){
 if(!rows.length)return "";
 const keys=Object.keys(rows[0]).filter(k=>k!=="_id"&&k!=="docFiles");
 const head=keys.join(",");
 const body=rows.map(r=>keys.map(k=>{let v=r[k]==null?"":String(r[k]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");
 return head+"\n"+body;
}
function download(name,text,type){const blob=new Blob([text],{type:type||"text/plain"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(pageId){const coll=pageColl[pageId];if(!coll||!state[coll].length){toast("No data to export");return}download(pageId+".csv",toCSV(state[coll]),"text/csv");toast("Exported "+pageId+".csv")}
function exportJSON(){const copy={};Object.keys(pageColl).forEach(p=>copy[pageColl[p]]=state[pageColl[p]]);download("fleetpro-backup.json",JSON.stringify(copy,null,2),"application/json");toast("Backup exported")}
function importJSON(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);Object.keys(pageColl).forEach(p=>{const c=pageColl[p];if(Array.isArray(data[c]))state[c]=data[c]});ensureIds(state);saveState();renderAll();toast("Backup imported ✓")}catch(err){alert("Invalid backup file.")}};r.readAsText(file);e.target.value="";}
function resetDemo(){if(!confirm("Replace all current data with demo data?"))return;localStorage.removeItem(STORAGE_KEY);state=loadState();buildPages();renderAll();toast("Demo data restored")}
function clearAll(){if(!confirm("Delete ALL records? This cannot be undone."))return;Object.keys(pageColl).forEach(p=>state[pageColl[p]]=[]);saveState();renderAll();toast("All data cleared")}

/* ---------------- modal / toast ---------------- */
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),2600)}

/* connect to the shared cloud database if keys are configured */
initCloud();
</script>
