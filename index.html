<style>

*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:white;border:1px solid var(--border);border-radius:14px;padding:30px;box-shadow:0 10px 35px #00000012}.logo{font-size:25px;font-weight:800;margin-bottom:8px}.logo span{color:#3b82f6}.sub{color:var(--muted);font-size:13px;margin-bottom:24px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#991b1b}.login .btn{width:100%;margin-top:8px}.demo{font-size:11px;color:#64748b;background:#f8fafc;padding:10px;border-radius:7px;margin-top:15px}
.app{display:flex;min-height:100vh}.sidebar{width:235px;background:var(--nav);color:#fff;padding:20px 13px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto}.brand{font-size:21px;font-weight:800;padding:3px 12px 24px}.brand span{color:#60a5fa}.role{font-size:10px;color:#94a3b8;text-transform:uppercase;padding:0 12px 8px}.nav{display:grid;gap:4px}.nav button{background:none;border:0;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:#273650;color:white}.content{margin-left:235px;width:calc(100% - 235px);padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{font-size:24px;margin:0}.topright{display:flex;gap:10px;align-items:center}.pill{font-size:12px;background:white;border:1px solid var(--border);padding:9px 12px;border-radius:8px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card,.panel{background:var(--card);border:1px solid var(--border);border-radius:10px}.card{padding:16px}.label{font-size:11px;color:var(--muted)}.num{font-size:26px;font-weight:800;margin-top:7px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.blue{color:var(--accent)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel{padding:17px;margin-bottom:16px}.panel h2{font-size:15px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.toolbar input,.toolbar select{padding:9px;border:1px solid #cbd5e1;border-radius:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 8px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted)}.badge{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}.available{background:#dcfce7;color:#166534}.rented{background:#dbeafe;color:#1d4ed8}.maintenance{background:#ffedd5;color:#c2410c}.breakdown{background:#fee2e2;color:#b91c1c}.alert{padding:11px;border-left:4px solid var(--red);background:#fff7f7;border-radius:6px;font-size:12px;margin-bottom:8px}.success{border-left-color:var(--green);background:#f0fdf4}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.formgrid .field{margin:0}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:5}.modalbox{background:white;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.detail div{background:#f8fafc;border-radius:7px;padding:11px}.detail small{display:block;color:var(--muted);font-size:10px}.detail b{font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:12px 15px;border-radius:8px;font-size:12px;z-index:10}.usercards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.empty{color:var(--muted);font-size:13px;padding:15px 0}.mobileonly{display:none}.dash-charts{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;margin-top:16px}.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:17px}.chart-card h2{font-size:15px;margin:0 0 6px}.chart-sub{font-size:11px;color:var(--muted);margin-bottom:14px}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px;min-height:190px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) 0 40%,var(--green) 40% 60%,var(--orange) 60% 80%,var(--red) 80% 100%);position:relative}.donut:after{content:"";position:absolute;inset:28px;background:#fff;border-radius:50%}.legend{display:grid;gap:9px;font-size:11px}.legend-item{display:flex;align-items:center;gap:7px}.legend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.dot-blue{background:var(--accent)}.dot-green{background:var(--green)}.dot-orange{background:var(--orange)}.dot-red{background:var(--red)}.bar-chart{display:grid;gap:12px;padding:6px 0 4px}.bar-row{display:grid;grid-template-columns:100px 1fr 38px;align-items:center;gap:10px;font-size:11px}.bar-track{height:18px;background:#eef2f7;border-radius:5px;overflow:hidden}.bar-fill{height:100%;border-radius:5px;background:var(--accent);min-width:3px}.chart-note{font-size:10px;color:var(--muted);margin-top:12px}@media(max-width:950px){.dash-charts{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.formgrid,.detail,.usercards{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.sidebar{width:190px}.content{margin-left:190px;width:calc(100% - 190px);padding:15px}.cards{grid-template-columns:1fr}.formgrid,.detail,.usercards{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.topright .pill{display:none}}
.oct-logo{width:100%;max-width:205px;height:auto;display:block;margin:0 auto 18px}
.loginbox .oct-logo{max-width:290px;margin-bottom:18px}
.brand{display:flex!important;align-items:center;gap:7px}
.brand:before{content:"";display:none}
.company-sub{font-size:10px;color:#94a3b8;margin:-18px 12px 18px}
.btn.primary,.primary{background:#0878c9!important}
.brand span{color:#ed1b2f!important}
.muted{color:var(--muted);font-size:12px}
.rowbtns{display:flex;gap:6px}.btn.mini{padding:6px 10px;font-size:11px}
.filelink{color:var(--accent);cursor:pointer;text-decoration:underline}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginbox">
    <img class="oct-logo" src="Ottawa Logo Login.png" alt="Ottawa Cont. & Trading W.L.L. logo" onerror="this.style.display='none'">
    <div class="logo">Fleet<span> Management</span> Portal</div>
    <div class="sub">Equipment Rental & Fleet Management</div>
    <div class="field"><label>Username</label><input id="username" value="admin"></div>
    <div class="field"><label>Password</label><input id="password" type="password" value="admin123" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="field"><label>Portal</label>
      <select id="portal"><option value="admin">Admin Portal</option><option value="user">User / Staff Portal</option></select>
    </div>
    <button class="btn primary" onclick="login()">Sign in</button>
    <div class="demo">Demo accounts: admin / admin123 &nbsp; | &nbsp; staff / staff123</div>
  </div>
</div>

<div id="app" class="app hidden">
<aside class="sidebar">
  <img class="oct-logo" src="Ottawa Logo.png" alt="Ottawa Cont. & Trading W.L.L. logo" onerror="this.style.display='none'">
  <div class="brand"><span style="color:#ed1b2f">Contracting & Trading</span><span></span></div>
  <div id="roleLabel" class="role">Administrator</div>
  <div id="nav" class="nav"></div>
  <button class="btn secondary" style="margin:18px 12px;width:calc(100% - 24px)" onclick="logout()">Sign out</button>
</aside>
<main class="content">
  <div class="top"><h1 id="pageTitle">Dashboard</h1><div class="topright"><div class="pill" id="datePill"></div><div class="pill" id="userPill"></div></div></div>
  <div id="pages"></div>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn secondary" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============================================================
   O.C.T. FleetPro V2 — data + persistence layer
   - Structured records: saved in localStorage (survives refresh)
   - Uploaded files: saved in IndexedDB (survives refresh)
   ============================================================ */

const STORAGE_KEY = "octfleetpro.v2";

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* -------- default (demo) data — used only on first ever load -------- */
function defaultState(){return{
 role:null,user:null,
 fleet:[
  {id:"EXC-001",cat:"Excavator",model:"CAT 320",year:2022,hours:4820,location:"Lusail Project",status:"Rented"},
  {id:"EXC-002",cat:"Excavator",model:"Komatsu PC210",year:2021,hours:5110,location:"Doha Garage",status:"Available"},
  {id:"WL-004",cat:"Wheel Loader",model:"CAT 950",year:2021,hours:6210,location:"Workshop",status:"Maintenance"},
  {id:"GEN-007",cat:"Generator",model:"Perkins 500KVA",year:2023,hours:2180,location:"Doha Garage",status:"Available"},
  {id:"FL-012",cat:"Forklift",model:"Toyota 8T",year:2020,hours:7140,location:"Industrial Area",status:"Breakdown"}
 ],
 rentals:[
  {no:"CN-1025",customer:"ABC Contracting",fleet:"EXC-001",site:"Lusail",start:"2026-08-01",end:"2026-09-30",startReading:"4800",endReading:"",rate:"QAR 18,000/mo",status:"Active"},
  {no:"CN-1031",customer:"Gulf Builders",fleet:"GEN-007",site:"West Bay",start:"2026-08-15",end:"2026-11-15",startReading:"2100",endReading:"",rate:"QAR 9,500/mo",status:"Active"}
 ],
 breakdowns:[
  {no:"BD-2026-00125",fleet:"EXC-001",date:"2026-08-25",location:"Lusail",severity:"Medium",reason:"Hydraulic hose failure",hours:"6",status:"Closed"},
  {no:"BD-2026-00131",fleet:"FL-012",date:"2026-08-27",location:"Industrial Area",severity:"High",reason:"Transmission failure",hours:"2",status:"Open"}
 ],
 maintenance:[
  {fleet:"EXC-001",service:"Engine Oil & Filters",interval:"500 hrs",current:"4820",next:"5000",tech:"Ahmed",status:"Due Soon"},
  {fleet:"WL-004",service:"Full 1,000 hr Service",interval:"1,000 hrs",current:"6210",next:"6000",tech:"Rashid",status:"Overdue"},
  {fleet:"GEN-007",service:"Generator Inspection",interval:"250 hrs",current:"2180",next:"2250",tech:"Imran",status:"Scheduled"}
 ],
 workshop:[
  {no:"WO-2026-00451",fleet:"EXC-001",job:"Replace hydraulic hose",tech:"Ahmed",parts:"Hydraulic hose",cost:"QAR 1,100",status:"Completed"},
  {no:"WO-2026-00458",fleet:"FL-012",job:"Transmission diagnosis",tech:"Rashid",parts:"Pending",cost:"",status:"In Progress"}
 ],
 locations:[
  {datetime:"2026-08-27 08:00",fleet:"EXC-001",location:"Doha Garage",event:"Departed",hours:"4812"},
  {datetime:"2026-08-27 09:15",fleet:"EXC-001",location:"Lusail Project",event:"Arrived",hours:"4815"},
  {datetime:"2026-08-27 12:30",fleet:"EXC-001",location:"Lusail Project",event:"Operating",hours:"4820"}
 ],
 garageInventory:[
  {no:"HYD-4421",item:"Hydraulic Hose",cat:"Hydraulic",qty:2,min:5,unit:"Nos",location:"Main Garage",supplier:"Local Supplier"},
  {no:"FLT-1102",item:"Oil Filter",cat:"Filters",qty:28,min:10,unit:"Nos",location:"Main Garage",supplier:"Gulf Parts"}
 ],
 staff:[
  {id:"ST-001",name:"Ahmed Khan",passport:"P1234567",passportExpiry:"2028-06-15",license:"DL-45821",licenseExpiry:"2027-12-15",designation:"Heavy Equipment Operator",phone:"+974 5000 1001",status:"Active",docFiles:[]},
  {id:"ST-002",name:"Rashid Ali",passport:"P2345678",passportExpiry:"2029-03-22",license:"DL-56214",licenseExpiry:"2027-03-22",designation:"Mechanic",phone:"+974 5000 1002",status:"Active",docFiles:[]}
 ],
 vehicleRecords:[
  {fleet:"EXC-001",registration:"QTR-45821",vin:"CAT320-2022-001",insurancePolicy:"INS-2026-45821",insuranceExpiry:"2026-11-30",registrationExpiry:"2027-01-31",inspectionExpiry:"2026-12-15",purchaseDate:"2022-01-10",docFiles:[]},
  {fleet:"GEN-007",registration:"QTR-77103",vin:"PERKINS-500-007",insurancePolicy:"INS-2026-77103",insuranceExpiry:"2026-12-20",registrationExpiry:"2027-02-28",inspectionExpiry:"2027-01-10",purchaseDate:"2023-05-18",docFiles:[]}
 ],
 documents:[
  {fleet:"EXC-009",doc:"Insurance",expiry:"2026-09-08",status:"",docFiles:[]},
  {fleet:"FL-012",doc:"Inspection Certificate",expiry:"2026-12-15",status:"",docFiles:[]}
 ],
 users:[
  {username:"admin",name:"System Administrator",role:"Administrator",email:"admin@oct.qa",phone:"+974 5000 0001",status:"Active"},
  {username:"staff",name:"Staff User",role:"Staff / Operator",email:"staff@oct.qa",phone:"+974 5000 0002",status:"Active"}
 ]
}}

/* ---------------- load / save ---------------- */
var state = loadState();

function loadState(){
 let base = defaultState();
 try{
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
   const saved = JSON.parse(raw);
   // merge: keep default structure, override with saved collections
   for(const k of Object.keys(base)){
    if(Array.isArray(base[k]) && Array.isArray(saved[k])) base[k]=saved[k];
   }
  }
 }catch(e){console.warn("Could not load saved data:",e)}
 // never persist the live session role
 base.role=null; base.user=null;
 ensureIds(base);
 return base;
}
function ensureIds(s){
 ["fleet","rentals","breakdowns","maintenance","workshop","locations","garageInventory","staff","vehicleRecords","documents","users"].forEach(coll=>{
  (s[coll]||[]).forEach(r=>{ if(!r._id) r._id=uid(); });
 });
}
function saveState(){
 try{
  const copy={};
  ["fleet","rentals","breakdowns","maintenance","workshop","locations","garageInventory","staff","vehicleRecords","documents","users"].forEach(k=>copy[k]=state[k]);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(copy));
 }catch(e){
  toast("⚠ Could not save (storage full). Export a backup.");
  console.error(e);
 }
}

/* ---------------- IndexedDB file store ---------------- */
let _db=null;
function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);let r;try{r=indexedDB.open("octfleetpro_files",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files")};r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)})}
async function idbPut(id,blob){try{const db=await openDB();return await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error)})}catch(e){console.warn("file store failed",e);return false}}
async function idbGet(id){try{const db=await openDB();return await new Promise(res=>{const tx=db.transaction("files","readonly");const rq=tx.objectStore("files").get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch(e){return null}}
async function captureFiles(inputEl){const out=[];if(!inputEl||!inputEl.files||!inputEl.files.length)return out;for(const f of Array.from(inputEl.files)){const id=uid();const ok=await idbPut(id,f);out.push({id:ok?id:null,name:f.name,type:f.type,size:f.size})}return out}
async function openFile(id){const blob=await idbGet(id);if(!blob){toast("File not available (stored on a different browser/device)");return}const url=URL.createObjectURL(blob);window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),60000)}
function fileLinks(arr){if(!arr||!arr.length)return "—";return arr.map(f=>f.id?`<span class="filelink" onclick="openFile('${f.id}')">${esc(f.name)}</span>`:esc(f.name)).join(", ")}

/* ---------------- navigation config ---------------- */
const adminNav=[["dashboard","🏠 Dashboard"],["fleet","🚜 Fleet"],["rentals","📋 Rentals"],["maintenance","🔧 Maintenance"],["breakdowns","🚨 Breakdowns"],["workshop","🛠️ Workshop"],["locations","📍 Locations"],["inventory","📦 Garage Inventory"],["staff","👥 Staff"],["vehicleRecords","🚘 Vehicle Records"],["documents","📄 Documents"],["reports","📊 Reports"],["users","👤 Users"]];
const userNav=[["userdash","🏠 My Dashboard"],["myfleet","🚜 My Equipment"],["report","🚨 Report Breakdown"],["mymain","🔧 Maintenance"],["profile","👤 My Profile"]];
const titles={dashboard:"Fleet Dashboard",fleet:"Fleet / Equipment Master",rentals:"Rental Management",maintenance:"Preventive Maintenance",breakdowns:"Breakdown Management",workshop:"Workshop & Repairs",locations:"Location History",inventory:"Garage Inventory",staff:"Staff Records",vehicleRecords:"Vehicle Records",documents:"Documents & Expiry",reports:"Management Reports",users:"User Management",userdash:"My Dashboard",myfleet:"My Equipment",report:"Report Breakdown",mymain:"My Maintenance",profile:"My Profile"};

/* pageId -> state collection name (for generic CSV export) */
const pageColl={fleet:"fleet",rentals:"rentals",maintenance:"maintenance",breakdowns:"breakdowns",workshop:"workshop",locations:"locations",inventory:"garageInventory",staff:"staff",vehicleRecords:"vehicleRecords",documents:"documents",users:"users"};

/* ---------------- auth ---------------- */
function login(){
 const p=document.getElementById("portal").value,u=document.getElementById("username").value.trim(),pw=document.getElementById("password").value;
 if((p==="admin"&&u==="admin"&&pw==="admin123")||(p==="user"&&u==="staff"&&pw==="staff123")){
  state.role=p;state.user=u;
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  buildNav();buildPages();
  showPage(p==="admin"?"dashboard":"userdash");
  document.getElementById("datePill").textContent=new Date().toLocaleDateString();
  document.getElementById("userPill").textContent=(p==="admin"?"Administrator":"Staff User");
 }else alert("Invalid demo credentials.");
}
function logout(){state.role=null;document.getElementById("app").classList.add("hidden");document.getElementById("login").classList.remove("hidden")}
function buildNav(){document.getElementById("roleLabel").textContent=state.role==="admin"?"Administrator":"Staff / User";document.getElementById("nav").innerHTML=(state.role==="admin"?adminNav:userNav).map(x=>`<button data-page="${x[0]}" onclick="showPage('${x[0]}')">${x[1]}</button>`).join("")}
function showPage(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));let el=document.getElementById(id);if(el)el.classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===id));document.getElementById("pageTitle").textContent=titles[id]||"FleetPro"}

/* ---------------- helpers ---------------- */
function badge(s){s=s||"";let l=s.toLowerCase();let c=l.includes("break")||l.includes("overdue")||l.includes("expired")||s==="Open"?"breakdown":l.includes("rent")||s==="Active"||l.includes("progress")?"rented":l.includes("maint")||l.includes("due")||l.includes("expir")||l.includes("scheduled")||l.includes("low")?"maintenance":"available";return `<span class="badge ${c}">${esc(s)}</span>`}
function opts(list,sel){return list.map(v=>`<option ${v===sel?"selected":""}>${esc(v)}</option>`).join("")}
function fleetOpts(sel){return state.fleet.map(f=>`<option ${f.id===sel?"selected":""}>${esc(f.id)}</option>`).join("")}
function find(coll,id){return state[coll].find(r=>r._id===id)}
function del(coll,id){if(!confirm("Delete this record permanently?"))return;state[coll]=state[coll].filter(r=>r._id!==id);saveState();renderAll();toast("Record deleted")}
function actionBtns(coll,id,editFn){return `<div class="rowbtns"><button class="btn secondary mini" onclick="${editFn}('${id}')">Edit</button><button class="btn danger mini" onclick="del('${coll}','${id}')">Delete</button></div>`}
function daysLeft(dateStr){if(!dateStr)return null;let t=Date.parse(dateStr);if(isNaN(t))return null;return Math.ceil((t-Date.now())/86400000)}
function docStatus(dateStr){let d=daysLeft(dateStr);if(d==null)return "Valid";if(d<0)return "Expired";if(d<=30)return "Expiring Soon";return "Valid"}

/* ---------------- build page shells ---------------- */
function buildPages(){
document.getElementById("pages").innerHTML=`
<section id="dashboard" class="page"></section>
<section id="fleet" class="page"></section>
<section id="rentals" class="page"></section>
<section id="maintenance" class="page"></section>
<section id="breakdowns" class="page"></section>
<section id="workshop" class="page"></section>
<section id="locations" class="page"></section>
<section id="inventory" class="page"></section>
<section id="staff" class="page"></section>
<section id="vehicleRecords" class="page"></section>
<section id="documents" class="page"></section>
<section id="reports" class="page"></section>
<section id="users" class="page"></section>
<section id="userdash" class="page"></section>
<section id="myfleet" class="page"></section>
<section id="report" class="page"></section>
<section id="mymain" class="page"></section>
<section id="profile" class="page"></section>`;
renderAll();
}

function toolbar(pageId,searchPh,addLabel,addFn){
 return `<div class="toolbar">
  <input id="${pageId}Search" placeholder="${searchPh}" oninput="render_${pageId}()">
  ${addLabel?`<button class="btn primary" onclick="${addFn}">${addLabel}</button>`:""}
  <button class="btn secondary" onclick="exportCSV('${pageId}')">Export CSV</button>
 </div>`;
}
function tableShell(pageId,heads){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Actions</th></tr></thead><tbody id="${pageId}Rows"></tbody></table></div>`}
function filterRows(coll,pageId){let q=(document.getElementById(pageId+"Search")?.value||"").toLowerCase();return state[coll].filter(r=>Object.entries(r).filter(([k])=>k!=="_id"&&k!=="docFiles").map(([,v])=>v).join(" ").toLowerCase().includes(q))}
function emptyRow(n){return `<tr><td colspan="${n}" class="empty">No records yet. Use the “Add” button above.</td></tr>`}

/* ---------------- master render ---------------- */
function renderAll(){

/* ---------------- dashboard ---------------- */
function renderDashboard(){
 const total=state.fleet.length,
   av=state.fleet.filter(x=>x.status==="Available").length,
   re=state.fleet.filter(x=>x.status==="Rented").length,
   ma=state.fleet.filter(x=>x.status==="Maintenance").length,
   br=state.fleet.filter(x=>x.status==="Breakdown").length;
 const maxStatus=Math.max(av,re,ma,br,1), totalStatus=av+re+ma+br||1;
 const avPct=Math.round(av/totalStatus*100),rePct=Math.round(re/totalStatus*100),maPct=Math.round(ma/totalStatus*100);
 const donutStyle=`background:conic-gradient(var(--green) 0 ${avPct}%,var(--accent) ${avPct}% ${avPct+rePct}%,var(--orange) ${avPct+rePct}% ${avPct+rePct+maPct}%,var(--red) ${avPct+rePct+maPct}% 100%)`;
 document.getElementById("dashboard").innerHTML=`<div class="cards">
 <div class="card"><div class="label">TOTAL FLEET</div><div class="num">${total}</div></div>
 <div class="card"><div class="label">AVAILABLE</div><div class="num green">${av}</div></div>
 <div class="card"><div class="label">RENTED</div><div class="num blue">${re}</div></div>
 <div class="card"><div class="label">MAINTENANCE</div><div class="num orange">${ma}</div></div>
 <div class="card"><div class="label">BREAKDOWN</div><div class="num red">${br}</div></div></div>
 <div class="dash-charts">
  <div class="chart-card"><h2>Fleet Status Distribution</h2><div class="chart-sub">Current equipment status from the fleet register</div><div class="donut-wrap"><div class="donut" style="${donutStyle}"></div><div class="legend"><div class="legend-item"><span class="legend-dot dot-green"></span>Available: ${av}</div><div class="legend-item"><span class="legend-dot dot-blue"></span>Rented: ${re}</div><div class="legend-item"><span class="legend-dot dot-orange"></span>Maintenance: ${ma}</div><div class="legend-item"><span class="legend-dot dot-red"></span>Breakdown: ${br}</div></div></div></div>
  <div class="chart-card"><h2>Fleet Status by Category</h2><div class="chart-sub">Equipment count by current status</div><div class="bar-chart">
   <div class="bar-row"><span>Available</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,av/maxStatus*100)}%"></div></div><b>${av}</b></div>
   <div class="bar-row"><span>Rented</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,re/maxStatus*100)}%"></div></div><b>${re}</b></div>
   <div class="bar-row"><span>Maintenance</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,ma/maxStatus*100)}%"></div></div><b>${ma}</b></div>
   <div class="bar-row"><span>Breakdown</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,br/maxStatus*100)}%"></div></div><b>${br}</b></div>
  </div><div class="chart-note">Charts update automatically when fleet records change.</div></div>
 </div>
 <div class="grid">
  <div>
   <div class="panel"><h2>Fleet Overview</h2>${fleetTable()}</div>
  </div>
  <div><div class="panel"><h2>Alerts</h2>${buildAlerts()}</div></div>
 </div>`;
}
function buildAlerts(){
 let a=[];
 state.breakdowns.filter(b=>b.status!=="Closed").forEach(b=>a.push(["red",`${b.fleet} — ${b.reason}`]));
 state.maintenance.filter(m=>/overdue/i.test(m.status)).forEach(m=>a.push(["orange",`${m.fleet} — ${m.service} overdue`]));
 state.maintenance.filter(m=>/due/i.test(m.status)).forEach(m=>a.push(["orange",`${m.fleet} — ${m.service} due soon`]));
 state.documents.forEach(d=>{let dl=daysLeft(d.expiry);if(dl!=null&&dl<=30)a.push(["orange",`${d.fleet} — ${d.doc} ${dl<0?"expired":"expires in "+dl+" days"}`])});
 state.vehicleRecords.forEach(v=>{let dl=daysLeft(v.insuranceExpiry);if(dl!=null&&dl<=30)a.push(["orange",`${v.fleet} — insurance ${dl<0?"expired":"expires in "+dl+" days"}`])});
 state.garageInventory.filter(i=>Number(i.qty)<Number(i.min)).forEach(i=>a.push(["orange",`${i.item} — low stock (${i.qty}/${i.min})`]));
 if(!a.length)return `<div class="alert success">🟢 No critical alerts. All systems normal.</div>`;
 return a.slice(0,12).map(([c,t])=>`<div class="alert ${c==="red"?"":"success"}" style="${c==="orange"?"border-left-color:var(--orange);background:#fff8f1":""}">${c==="red"?"🔴":"🟠"} ${esc(t)}</div>`).join("");
}

function submitBtn(txt){return `<button class="btn primary" style="margin-top:16px">${txt}</button>`}

/* FLEET */
function openFleet(id){let f=id?find("fleet",id):{};openModal(id?"Edit Equipment":"Add Equipment",`<form onsubmit="saveFleet(event,'${id||""}')"><div class="formgrid">
 <div class="field"><label>Fleet ID</label><input id="f_id" value="${esc(f.id||"")}" required></div>
 <div class="field"><label>Category</label><input id="f_cat" value="${esc(f.cat||"")}" required></div>
 <div class="field"><label>Model</label><input id="f_model" value="${esc(f.model||"")}" required></div>
 <div class="field"><label>Year</label><input id="f_year" type="number" min="1900" max="2100" value="${esc(f.year||"")}" required></div>
 <div class="field"><label>Engine Hours</label><input id="f_hours" type="number" min="0" value="${esc(f.hours!=null?f.hours:0)}" required></div>
 <div class="field"><label>Location</label><input id="f_loc" value="${esc(f.location||"")}" required></div>
 <div class="field"><label>Status</label><select id="f_status">${opts(["Available","Rented","Maintenance","Breakdown"],f.status||"Available")}</select></div>

function saveFleet(e,id){e.preventDefault();let rec={id:f_id.value.trim(),cat:f_cat.value.trim(),model:f_model.value.trim(),year:+f_year.value,hours:+f_hours.value,location:f_loc.value.trim(),status:f_status.value};upsert("fleet",id,rec);done("fleet","Equipment "+(id?"updated":"added"))}

/* ---------------- upsert / done ---------------- */
function upsert(coll,id,rec){
 if(id){let existing=find(coll,id);Object.assign(existing,rec);}
 else{rec._id=uid();state[coll].push(rec);}
 saveState();
}
function done(page,msg){closeModal();renderAll();showPage(page);toast(msg+" ✓")}

/* ============================================================
   USER PORTAL forms
   ============================================================ */
function userDash(){
 const assigned=state.rentals.filter(r=>r.status==="Active").length;
 const open=state.breakdowns.filter(b=>b.status!=="Closed").length;
 const due=state.maintenance.filter(m=>/due|overdue/i.test(m.status)).length;
 return `<div class="cards">
  <div class="card"><div class="label">ACTIVE RENTALS</div><div class="num blue">${assigned}</div></div>
  <div class="card"><div class="label">OPEN BREAKDOWNS</div><div class="num red">${open}</div></div>
  <div class="card"><div class="label">SERVICE DUE</div><div class="num orange">${due}</div></div></div>
  <div class="grid"><div class="panel"><h2>Quick Actions</h2>
   <button class="btn primary" onclick="showPage('report')">Report Breakdown</button>
   <button class="btn secondary" onclick="showPage('myfleet')">View My Equipment</button></div>
  <div class="panel"><h2>Notice</h2>${buildAlerts()}</div></div>`;
}
function reportBreakdownForm(){
 return `<div class="panel"><h2>Report a Breakdown</h2><form onsubmit="submitUserBreakdown(event)"><div class="formgrid">
  <div class="field"><label>Equipment</label><select id="ub_fleet">${fleetOpts()}</select></div>
  <div class="field"><label>Location</label><input id="ub_location" required placeholder="Project / site"></div>

  <div class="field"><label>Reason</label><select id="ub_reason">${opts(["Engine","Hydraulic","Electrical","Transmission","Cooling","Tyres / Undercarriage","Operator Related","Other"],"Engine")}</select></div>
  <div class="field"><label>Engine Hours</label><input id="ub_hours" type="number" min="0" required></div>
  <div class="field"><label>Description</label><input id="ub_desc" required placeholder="Describe the problem"></div>
  </div><button class="btn primary" style="margin-top:16px">Submit Breakdown</button></form></div>`;

function submitUserBreakdown(e){e.preventDefault();
 let rec={_id:uid(),no:"BD-"+new Date().getFullYear()+"-"+Date.now().toString().slice(-5),fleet:ub_fleet.value,date:new Date().toISOString().slice(0,10),location:ub_location.value.trim(),severity:ub_sev.value,reason:ub_reason.value+" — "+ub_desc.value.trim(),hours:ub_hours.value,status:"Open"};
 state.breakdowns.unshift(rec);let f=state.fleet.find(x=>x.id===rec.fleet);if(f)f.status="Breakdown";saveState();renderAll();showPage("userdash");toast("Breakdown submitted to maintenance team ✓")}

/* ============================================================
   REPORTS + BACKUP / EXPORT
   ============================================================ */
function renderReports(){
 const total=state.fleet.length,
   av=state.fleet.filter(x=>x.status==="Available").length,
   re=state.fleet.filter(x=>x.status==="Rented").length,
   util=total?Math.round(re/total*100):0,
   openBd=state.breakdowns.filter(b=>b.status!=="Closed").length,
   overdue=state.maintenance.filter(m=>/overdue/i.test(m.status)).length,
   low=state.garageInventory.filter(i=>Number(i.qty)<Number(i.min)).length,
   activeRent=state.rentals.filter(r=>r.status==="Active").length;
 document.getElementById("reports").innerHTML=`
 <div class="cards">
  <div class="card"><div class="label">TOTAL FLEET</div><div class="num">${total}</div></div>
  <div class="card"><div class="label">ACTIVE RENTALS</div><div class="num blue">${activeRent}</div></div>
  <div class="card"><div class="label">OPEN BREAKDOWNS</div><div class="num red">${openBd}</div></div>
  <div class="card"><div class="label">OVERDUE SERVICE</div><div class="num orange">${overdue}</div></div>
  <div class="card"><div class="label">UTILIZATION</div><div class="num green">${util}%</div></div></div>
 <div class="panel" style="margin-top:16px"><h2>Management Reports</h2>
  <p class="muted">Live figures calculated from your records. Low-stock parts: ${low}. Export any table to CSV, or back up the entire database as JSON.</p>
  <div class="toolbar" style="margin-top:10px">
   <button class="btn secondary" onclick="exportCSV('fleet')">Fleet CSV</button>
   <button class="btn secondary" onclick="exportCSV('rentals')">Rentals CSV</button>
   <button class="btn secondary" onclick="exportCSV('maintenance')">Maintenance CSV</button>
   <button class="btn secondary" onclick="exportCSV('breakdowns')">Breakdowns CSV</button>
   <button class="btn secondary" onclick="exportCSV('inventory')">Inventory CSV</button>
   <button class="btn secondary" onclick="exportCSV('staff')">Staff CSV</button>
  </div>
 </div>
 <div class="panel"><h2>Backup & Restore</h2>
  <p class="muted">Data is saved in this browser automatically. Use backup to move data to another device or keep a copy.</p>
  <div class="toolbar" style="margin-top:10px">
   <button class="btn primary" onclick="exportJSON()">⬇ Export Backup (JSON)</button>
   <button class="btn secondary" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
   <input id="importFile" type="file" accept=".json" class="hidden" onchange="importJSON(event)">
   <button class="btn secondary" onclick="resetDemo()">Reset to Demo Data</button>
   <button class="btn danger" onclick="clearAll()">Clear All Data</button>
  </div>
 </div>`;
}

function toCSV(rows){
 if(!rows.length)return "";
 const keys=Object.keys(rows[0]).filter(k=>k!=="_id"&&k!=="docFiles");
 const head=keys.join(",");
 const body=rows.map(r=>keys.map(k=>{let v=r[k]==null?"":String(r[k]);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");
 return head+"\n"+body;
}
function download(name,text,type){const blob=new Blob([text],{type:type||"text/plain"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(pageId){const coll=pageColl[pageId];if(!coll||!state[coll].length){toast("No data to export");return}download(pageId+".csv",toCSV(state[coll]),"text/csv");toast("Exported "+pageId+".csv")}
function exportJSON(){const copy={};Object.keys(pageColl).forEach(p=>copy[pageColl[p]]=state[pageColl[p]]);download("fleetpro-backup.json",JSON.stringify(copy,null,2),"application/json");toast("Backup exported")}
function importJSON(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);Object.keys(pageColl).forEach(p=>{const c=pageColl[p];if(Array.isArray(data[c]))state[c]=data[c]});ensureIds(state);saveState();renderAll();toast("Backup imported ✓")}catch(err){alert("Invalid backup file.")}};r.readAsText(file);e.target.value="";}
function resetDemo(){if(!confirm("Replace all current data with demo data?"))return;localStorage.removeItem(STORAGE_KEY);state=loadState();buildPages();renderAll();toast("Demo data restored")}
function clearAll(){if(!confirm("Delete ALL records? This cannot be undone."))return;Object.keys(pageColl).forEach(p=>state[pageColl[p]]=[]);saveState();renderAll();toast("All data cleared")}

/* ---------------- modal / toast ---------------- */
function openModal(t,b){document.getElementById("modalTitle").textContent=t;document.getElementById("modalBody").innerHTML=b;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),2600)}
</script>
